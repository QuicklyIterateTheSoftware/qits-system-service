# How qits-deployments deploys this repo. It reads this file from the git host at the built
# sha, so the answer travels with the commit.
#
# CARRYING THE FILE AT ALL is the other thing it says. qits-projects reads it at the release tag to
# decide whether this repository deploys — a library or an SPA carries none, and its release
# finalizes `main` there and then, while a deployable one waits for the deployment to succeed. What
# deploys is the VERSION COORDINATE the release build published, never a branch.
#
# THE NAME THIS DEPLOYS AS, spelled because the repository is renamed and the application is not.
# Every derivation the deployer makes hangs off this name — the wire alias peers dial, the container
# it manages, the extras family, the database — so letting it follow the repository would
# decommission the running service and start a stranger beside it.
application: qits-system

# One route for this application's machine surface: the API at /system/api, the terminal WebSocket at
# /system/api/terminals/{id} and the document at /system/q. The edge path-routes every application's
# route prefix on EVERY host, so this one line keeps all three reachable wherever a reader is. The
# client itself is no longer under it — it is served at / on this application's own host.
routes: /system

# WHERE THIS APPLICATION HANGS IN THE SIDEBAR. `system` is the global group — what this shows is the
# machine the whole platform runs on, which belongs to no project — and 4 is the position inside it,
# after Orchestrator:3.
#
# The host is not spelled because the derived one is already right: the application name minus its
# `qits-` prefix is `system`, which is the label this service is served on. The terminal
# socket's origin check needs that agreement: the page's origin and the forwarded host are the same
# name, so the handshake passes.
navigation-entries: system.System:4

# NO DATABASE, AND THAT IS THE DESIGN. This service is stateless: every answer is read from the
# docker daemon at the moment it is asked, and the only state it holds is the in-memory registry of
# live terminals — which a restart is MEANT to drop (the client reconnects and is told the session is
# gone). A database here would be a cache of facts that are already live, and a place for them to be
# wrong.
#
# idp:client ASKS QITS-DEPLOYMENTS TO PROVISION THIS APPLICATION'S OWN QITS-IDP SERVICE CLIENT — id
# `dev-qits-system` (derived from env + application), roles fixed in qits-idp code. It is NEW: the
# live `qits-platform-system` client the bootstrap wrote into /work/config is left unclaimed here,
# for qits-878 to collect. The deployer injects QITS_RESOURCE_IDP_URL, QITS_RESOURCE_IDP_CLIENT_ID
# and QITS_RESOURCE_IDP_CLIENT_SECRET; at boot the service writes its own docker config.json from the
# id and secret (the glances pull through the mirror), and points docker at it only once it exists.
#
# Ticket qits-879.
resources: idp:client
#
# WHAT IT DOES NEED IS NOT DECLARED HERE EITHER, because it is not a resource this deployer
# provisions: the host's docker socket. This is the third socket holder on the platform, after
# qits-containers and qits-deployments, and the grant is a deliberate, recorded act in the
# bootstrap's extras block — `mounts[]=bind:/var/run/docker.sock:/var/run/docker.sock` plus
# `groups[]=${DOCKER_GID}`, because the socket is root:docker 0660 and this image runs as uid 1001.
# Without both, the CLI is present and every call is a permission denial.

# The readiness endpoint the deployer's health gate curls. The convention derives it from the
# repository name and would land on exactly this path; it is written out because a probe that 404s
# fails a deployment for a reason nobody would look for in a config file.
#
# It is deliberately NOT a docker probe. Readiness here means "this process can answer", and the
# daemon being briefly unreachable is a 503 on a read, not a service that should be taken out of
# rotation and restarted — a restart would kill every live terminal to fix nothing.
health_path: /system/q/health/ready

# Where the browsable API document lives: swagger-ui under this service's non-application
# root, which sits under the primary route above. The shell's Api Docs viewer reads it off
# /main-navigation and frames it for this repository.
api-docs: /system/q/swagger-ui
