archetype: java-service
artifacts:
# THE IMAGE COORDINATE IS THE APPLICATION NAME, and it has to move WITH it in the same
# release. The deployer derives what to pull from the application in deployments.yml —
# `qits/<application>:<version>` — so an application renamed without this line publishes
# under the old coordinate and the deployment fails IMAGE_MISSING with a reference nothing
# ever pushed. Measured on 2026.926.31915:
#   no image registry.qits.wohlben.eu/qits/qits-system:2026.926.31915
  - { type: docker, name: qits/qits-system, sbom: .sbom/sbom.json }
# The provider golden masters (ticket qits-1149): the platform packages `golden-masters/` as
# `eu.wohlben.qits:qits-system-golden-masters` and `@qits/system-golden-masters`, each published
# only when its content changed. `contracts/GoldenMasterRecordingTest` records them.
contracts:
  application: qits-system
  golden-masters: { from: golden-masters/, packages: [maven, npm] }
  # This repository's consumer pact against qits-idp (OIDC discovery and JWKS), flat in `pacts/`
  # as `qits-system-service_qits-idp-service.json`; `contracts/IdpConsumerPactTest` writes it.
  pacts:
    qits-idp-service: { packages: [maven] }
# THE SITE IS SPELLED, AND IT NAMES THE COMPONENT. `true` derives it from the REPOSITORY name,
# which would put the retired tier modifier in a storage id and then MOVE that id the day the
# repository is renamed — a bundle's history stranded under a name nothing publishes to any
# more. Every other service on the estate already spells the component (@userflows/qits-ci,
# @userflows/qits-projects, @userflows/qits-observability); `true` survived only here, where the
# derived value happened to be tolerable. Spelled, the rename costs the bundle nothing.
userflows: qits-system
