# The application config for qits-system as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to a library jar's META-INF/microprofile-config.properties at ordinal 100, which is how
# `system` ships the DEFAULTS it does not own the deployment of (the docker binary and timeout, the
# glances image, the terminal limits). Any of those is overridable by env on top of this file.
#
# The tests read this file too — Quarkus merges src/test/resources/application.properties OVER it
# rather than replacing it — so everything below is in effect during the suite. That is deliberate:
# a test copy of an app-level key is free to drift from the shipped one, and then a green suite
# proves nothing about what actually starts.

# The deployed identity, and — because Quarkus feeds this key straight into the OpenTelemetry resource
# as `service.name` — the name this service's telemetry is filed under at qits-observability. The two
# are the same string on purpose: the only name a person has to know in order to find this process is
# the one they used to address it.
#
# It reads `qits-system` and not `qits-platform-system` because the platform plane is gone. There is no
# second class of service for `platform` to distinguish any more, the wire alias, the container name and
# the image coordinate all moved, and a word that no longer means anything left in the one place
# observability reads is worse than one that never existed: `_service/qits-platform-system` is a stream
# nobody will think to open.
#
# CHANGING THIS SPLITS THE TELEMETRY, and the size of that split was measured rather than assumed,
# because the obvious fear — that a long history forks in two — is not what happens here. The
# receiver, qits-observability, OWNS NO TABLES AND NO DATASOURCE. Its TelemetryStore is a
# ConcurrentHashMap of ring buffers whose key comes from the decoded service.name attribute
# (`_service/<name>`, in keyFor), bounded only by counts and bytes rather than by age:
# max-spans-per-workspace, max-logs-per-workspace, max-metric-series-per-workspace,
# max-bytes-per-source, max-total-bytes. There is NO retention policy, no TTL and no purge job, and
# nothing on that side names a service at all — no source table, no dashboard, no alert rule, no
# saved query. The SPA's lens is URL query state and is not stored either. So nothing DURABLE keys
# on service.name, and there is nothing to migrate.
#
# The change therefore costs minutes, not history. The old bucket stops filling, drains as its
# records are evicted, and disappears entirely the next time qits-observability restarts — and
# sources() keeps an emptied bucket listed with zero counts on purpose, so for a while both names
# appear side by side, which is the only genuinely confusing artefact. One real shape effect on top
# of that: a trace that straddles the rollover has its spans in two buckets, so the trace view draws
# a partial tree under each, and that lasts one deploy. What outlives the rollover is only copied
# links. A bookmarked `?source=_service/qits-platform-system`, or a `qits observe` filter spelling
# the old name, answers EMPTY rather than erroring — which draws as "no telemetry". Re-issue it with
# the new name; there is no alias on the receiving side and nowhere to put one that would survive a
# restart anyway.
#
# Set against a cost measured in minutes, leaving the old name in place is the permanent version of
# the same failure: `_service/qits-system` — the only name anything on this estate answers on now —
# would return nothing forever, and on this platform nothing is indistinguishable from no errors. A
# silence that looks like health is the failure to avoid, so the overlap is paid once.
#
# AND THIS KEY IS NOT ONLY TELEMETRY HERE, which is all it is in every sibling.
# `qits.system.terminals.owner` interpolates it — see the domain jar's
# META-INF/microprofile-config.properties — so it is also the VALUE of the `qits.system.owner` label
# this service stamps on the glances containers it runs, and the filter its boot sweep reaps by. The
# label defaults to the application name rather than to a constant because two platforms can share
# one docker daemon, and a sweep matching the bare label would kill the other platform's live
# terminals on every restart of this one.
#
# Write and read both come from this one key, so the running service stays self-consistent across
# the change. What does not is the PREVIOUS run's leftovers: a container labelled with the old value
# is now ignored rather than reaped, because the sweep is looking for the new one. That is a
# one-time window and not durable state — nothing here persists an owner, this service having no
# datasource at all — so the only casualties are glances containers that happened to be alive and
# orphaned at the moment of the cutover. They hold --pid host, --network host and a read-only docker
# socket, which makes them worth clearing by hand exactly once:
#
#     docker rm -f $(docker ps -aq --filter label=qits.system.owner=qits-platform-system)
#
# Normal teardown never depended on the label — TerminalSessions removes a container by the NAME it
# derived from the session id — so it is only crash recovery that is affected, and only across this
# one boundary.
quarkus.application.name=qits-system

# The JAX-RS prefix every qits route lives under: /<segment>/api, where the segment is this
# service's name without the qits- prefix. It read "without the qits-platform- prefix" until the
# plane was deleted, and the segment did NOT move when the name did — which is the point worth
# keeping: the prefix was never part of the routing, only part of the name it was stripped from.
# qits-gateway routes VERBATIM by prefix — /system/* reaches this service with the path untouched —
# so the leading segment is not decoration, it is the difference between being reachable through the
# gateway and not being reachable at all.
#
# NOTE the terminal WebSocket does NOT follow this key: @WebSocket takes a literal path, which
# api/TerminalSocket spells out as /system/api/terminals/{id}. The two move together by hand.
quarkus.rest.path=/system/api

# Quarkus' non-application root path: what the framework serves rather than application code (the
# OpenAPI document, swagger-ui, health). It sits OUTSIDE quarkus.rest.path and moves only via this
# key, so without it /q/* stays at the root — where a prefix-routing gateway cannot reach it. The
# readiness probe qits-platform-deployments' health gate curls is /system/q/health/ready, and it is
# this key that puts it there.
quarkus.http.non-application-root-path=/system/q

# --- the client ---------------------------------------------------------------------------------
# Quinoa builds src/main/webui (the qits-platform-spa-system submodule, an Angular SPA) during
# augmentation and serves the output as static resources.
#
# THE CLIENT IS SERVED AT THE ROOT, because this service has a host of its own —
# system.<env>.<domain>. The API and the terminal WebSocket keep their segment and are path-routed on
# every host, so the client's same-origin calls and its socket dial are unchanged; what moved is only
# where the page itself lives.
#
# THE TERMINAL SOCKET'S ORIGIN CHECK STILL PASSES, and it is worth saying why.
# TerminalOriginUpgradeCheck compares the handshake's Origin with X-Forwarded-Host. Served from this
# host the page's origin IS system.<env>.<domain>, which is the host the edge forwards — so the two
# agree, as they did when the page came from the environment host and the socket was dialled there.
#
# ui-root-path is now `/` and the client's angular.json says baseHref "/", so the two still agree —
# Quinoa mounts the files, the baseHref is what makes index.html ask for them at the right url, and a
# mismatch serves a page whose every asset 404s with nothing on this side to notice.
# PackagedSurfaceIT asserts the base href for exactly that reason.
quarkus.quinoa.ui-root-path=/

# Deep links. The client's own routes — /swarm/nodes/<id>/containers and /swarm/services/<id> — have
# no file behind them, so without this a reload or a pasted link 404s and only the entry page works.
# An operator shares a container's address with somebody; this is what makes that address work.
quarkus.quinoa.enable-spa-routing=true

# Angular's output. Quinoa can derive this from the client's angular.json, but it derives it from a
# project NAME — pinning it means a rename over there fails this build ("Quinoa build directory not
# found") rather than resolving somewhere stale.
quarkus.quinoa.build-dir=dist/qits-platform-spa-system/browser

# WHAT THE SPA FALLBACK MUST NOT SWALLOW.
#
# The fallback is a late-order catch-all: anything with a real route in front of it still wins, but a
# request matching NO route is rerouted to index.html and answers 200 text/html. The stake here is
# the client's own polling — GET /system/api/terminals while a session runs — and a mistyped or
# half-deployed path answering a PAGE would hand a JSON parser an HTML document. The correct answer
# to a mistyped machine path is a 404, and this key is the whole of what keeps it one.
#
# THE VALUE IS ABSOLUTE NOW. Entries are matched after ui-root-path is stripped, and the ui root is
# `/`, so nothing is stripped and every entry is the real path. The old relative spelling would name
# nothing.
#
# ONE ENTRY IS THE WHOLE LIST, because matching is by path SEGMENT: /system covers /system/api
# (quarkus.rest.path, and with it the terminal WebSocket at /system/api/terminals/<id>) and /system/q
# (quarkus.http.non-application-root-path) alike. It protects a segment and not a string prefix, so
# /system-nope is not covered by it and answers the page — which is right, that path belongs to
# nothing here.
#
# The segment is spelled in three keys of this file — quarkus.rest.path,
# quarkus.http.non-application-root-path and this one — plus `routes:` in .config/qits/deployments.yml.
# The client no longer spells it at all. Add a literal route outside the segment and its entry here
# IN THE SAME COMMIT.
quarkus.quinoa.ignored-path-prefixes=/system

# quarkus.quinoa.package-manager-install is deliberately NOT here. A local or CI mvnw build uses the
# node on PATH, so no build silently downloads a toolchain; the two install flags appear only in
# docker/Dockerfile's builder stage, which ships no node at all.
#
# Quinoa is also disabled by default in TEST mode and is left that way. A @QuarkusTest asserting
# anything about / would pass against a process with no client in it, so what the SPA is actually
# served as is proved against the packaged artifact and nowhere else — PackagedSurfaceIT.

# --- the API document ---------------------------------------------------------------------------
# Served at /system/q/openapi, with the browsable UI at /system/q/swagger-ui — both under
# quarkus.http.non-application-root-path above, not quarkus.rest.path.
quarkus.smallrye-openapi.info-title=qits-platform-system API
quarkus.swagger-ui.always-include=true

# --- identity -----------------------------------------------------------------------------------
# TWO TRACKS OF IDENTITY REACH THIS SERVICE AND THEY DO NOT REPLACE EACH OTHER. A request with no
# Authorization header is USER traffic: qits-gateway performed the login and asserted X-Qits-User /
# X-Qits-Roles, and qits-auth-core's ForwardAuthMechanism reads them. A request WITH a bearer is
# MACHINE traffic: quarkus-oidc validates the token against qits-idp.
#
# BOTH LAND AS ROLES, which is why every route here is @RolesAllowed and none of them calls
# MachineAuth.require(). `qits:system` is the machine role and `qits:admin` the human one; every
# REST route accepts the pair. Every GET also accepts `qits:agent`, a commissioned agent's role;
# opening or ending a terminal does not.
#
# THE WEBSOCKET TAKES ONLY qits:admin. Reading the host's shape is something a machine may do; an
# interactive shell on the platform host is not. See api/TerminalSocket.
#
# THERE IS NO ANONYMOUS ROUTE HERE AND THERE MUST NEVER BE ONE. What this service reads is the whole
# machine, and what it can open is a shell on it.

# THE ROLLOUT GATE IS OFF (qits.auth.machine.required, defaulted false by qits-auth-core), and
# VALIDATION FOLLOWS THAT GATE rather than standing on its own. Gate off, there is no OIDC tenant,
# nothing fetches a JWKS, nothing waits on a host named qits-idp, and a clone-alone
# `./mvnw verify` needs no issuer at all. There is no third state — either the gate and the
# validation are both on, or both off.
quarkus.oidc.tenant-enabled=${qits.auth.machine.required:false}

# Bearer-only: this service starts no login flow and holds no session — the gateway does both.
#
# THE ENVIRONMENT IS PART OF THE ADDRESS, AND THE SERVICE ALREADY KNOWS IT. The idp is an ordinary
# service in the one environment now, deployed as ${QITS_ENVIRONMENT}-qits-idp, and
# QITS_ENVIRONMENT is injected into every container by qits-deployments — so this derives the tier's
# idp rather than naming one, and no deployment has to state QUARKUS_OIDC_AUTH_SERVER_URL.
#
# The bare spelling this replaced no longer resolves at all: the plane-era swarm service was retired
# on 2026-09-25. A stored entry is what has been standing in for this line, which is exactly the
# thing that should not be config.
quarkus.oidc.auth-server-url=http://${QITS_ENVIRONMENT:dev}-qits-idp:8080/idp
quarkus.oidc.application-type=service

# DISCOVERY ON (Quarkus' default). quarkus-oidc reads auth-server-url + /.well-known/openid-configuration
# at boot and follows its `jwks_uri`. qits-idp builds that document from the internal address it was
# asked on, so the keys are fetched on the platform's own network. The pact rows in
# contracts/IdpConsumerPactTest bind what this reads of both answers.

# ONE AUDIENCE, AND IT IS THE PLATFORM'S, NOT THIS SERVICE'S NAME. qits-idp stamps
# `qits-platform` on every token it mints, whatever the caller asked for, so a receiver that accepts
# that one value is addressed by every caller there is: a platform peer's bearer and a person's
# `qits` CLI token alike. What such a caller may then do is decided by its ROLES — the ones spelled
# out above — and never by which service it was addressed to.
#
# It is a literal. The value does not vary by environment and nothing else here spells it, so there
# is no key to reference and nothing to keep in step.
quarkus.oidc.token.audience=qits-platform

# AN UNREACHABLE IDP DOES NOT STOP THIS SERVICE. connection-delay turns the single boot attempt into
# a retried one — 30S is fifteen tries, two seconds apart, which covers idp coming up beside this
# service on a cold boot. When the window expires a WARN is logged and startup continues. Readiness
# deliberately stays independent of idp: the deployer health-gates this service, and tying its
# readiness to another service's would make a cold boot a question of ordering.
quarkus.oidc.connection-delay=30S
# And how fast a ROTATED idp key is picked up. An unknown `kid` buys ONE JWKS refresh, and the
# default 10M is the minimum before the next — so one attempt landing while idp is mid-cutover would
# mean ten minutes of 401s. PT5S ends it seconds after idp answers.
quarkus.oidc.token.forced-jwk-refresh-interval=PT5S

# --- this service's own pull credential -------------------------------------------------------
# THE IDP CLIENT qits-deployments PROVISIONS FOR THIS APPLICATION (`idp:client` in
# .config/qits/deployments.yml, id dev-qits-system), injected as QITS_RESOURCE_IDP_CLIENT_ID and
# QITS_RESOURCE_IDP_CLIENT_SECRET. startup/DockerCredentialWriter turns the pair into the docker CLI's
# config.json at boot, before the boot sweep's glances pull. Empty unless both are injected, and
# empty means nothing is written and the inherited DOCKER_CONFIG stands — a clone-alone test run and
# an older spec both land there. QITS_RESOURCE_IDP_URL is injected too and not read: the pull is a
# Basic id:secret at the edge, nothing here mints a token. Neither value is ever logged.
qits.system.docker.credential.client-id=${QITS_RESOURCE_IDP_CLIENT_ID:}
qits.system.docker.credential.client-secret=${QITS_RESOURCE_IDP_CLIENT_SECRET:}

# --- telemetry ------------------------------------------------------------------------------------
# One key names the receiver: qits.observability.url — scheme, host and port, NO path. It is the
# first key of that shape in this file: the only other peer this service names is qits-idp,
# and that one carries the issuer's own /idp path because an issuer string is what it is. The ingest
# path below is qits-observability's own and belongs to the service, not to the deployment, so it is
# spelled once here and derived rather than configured. Point this at a collector or a different host
# and everything below follows. A deployment overrides it by env as QITS_OBSERVABILITY_URL, which is
# what the platform's compose template already sets for this application — until this block existed
# that variable reached a process with no exporter in it.
qits.observability.url=http://${QITS_ENVIRONMENT:dev}-qits-observability:8080

# http/protobuf, not the gRPC default: the receiver is qits-observability's OtelReceiverResource over
# HTTP, and the exporter appends /v1/<signal> to this base — so this resolves to the three ingest
# routes at /observability/api/otel/v1/{traces,logs,metrics}.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${qits.observability.url}/observability/api/otel

# The source key on the far side follows quarkus.application.name (qits-system, at the top of this
# file). It is the deployed identity, not the repository name, and moving it moves this service's
# telemetry to a stream nobody is looking at — which is exactly what it was doing while it still read
# qits-platform-system, since that address no longer exists anywhere else on the estate. Read the
# paragraph on that key before touching it: a change here is not free, it splits the live stream in two for a rollover, and in
# this service it also moves the terminal owner label.
#
# Logs ride the same exporter; traces are on by default. The receiver decodes all three signals, and
# a log record correlated to a trace is most of why the receiver exists.
#
# THE THREE KEYS BELOW ARE SPELLED OUT ON PURPOSE. Quarkus still labels its OpenTelemetry logging
# integration PREVIEW, and the whole of what ships application logs to qits-observability is the
# handler this enables — so an upgrade that changed one of these defaults would stop this service's
# logging with a green build and no error anywhere. Written down, a change of default is a diff
# rather than a silence. Measured against Quarkus 3.34.6's own config classes — the version this
# repo's root pom pins as quarkus.platform.version — rather than recalled:
#
#   quarkus.otel.logs.handler.enabled  default true  (LogsRuntimeConfig.handlerEnabled)
#   quarkus.otel.logs.exporter         default cdi   (LogsBuildConfig.exporter)
#   quarkus.otel.logs.level            default ALL   (LogsRuntimeConfig.level)
#
# `cdi` is what routes the records at the exporter configured above rather than at a second,
# separately-configured one; `handler.enabled` is the JBoss Log Manager handler that turns an
# ordinary org.jboss.logging.Logger call into an OTLP record, and without it the other two keys
# describe a pipe nothing enters.
#
# The level is the ONE line here that is not the shipped default: Quarkus exports every record the
# log manager creates, and this makes INFO the outbound floor. Per-category quarkus.log levels still
# decide which records exist at all; this is a second gate on the way out, so that what leaves the
# process is a deliberate amount rather than whatever a debug category happens to emit — the terminal
# subsystem is chatty by design, logging per frame at DEBUG on both pumps while a PTY carrying a
# full-screen program produces a read every few milliseconds. Console logging is untouched by all of
# it — the OTel handler is an ADDITIONAL copy, never the only one, which is what keeps a container's
# stdout the durable-at-host fallback when the receiver is down.
#
# That an ordinary logger call really becomes an exported OTLP record is proven once, in qits-events:
# its OtelLogBridgeTest decodes a real ExportLogsServiceRequest and PackagedLogBridgeIT repeats the
# claim against the packaged artifact. The same extension and the same four keys run here, so this
# repo guards the configuration rather than re-proving the behaviour — telemetry/OtelLogConfigTest
# pins these values so drift cannot disable log export quietly.
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO

# Metrics ride it too. Off by default in Quarkus, so without this line the third signal never
# leaves — the receiver has always decoded it, and the observability UI has nothing to plot until
# every service says this.
quarkus.otel.metrics.enabled=true

# Dark outside a deployment, for the same reason nothing else in this repo reaches a peer outside
# one. A clone-alone `./mvnw verify` and a `quarkus:dev` have no qits-observability to resolve, let
# alone reach, and an exporter retrying against an unresolvable host turns every suite into a wall of
# export failures. The deployment is where telemetry is real.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true

# --- the terminal transport -----------------------------------------------------------------------
# How long a WebSocket may sit with no traffic before the server closes it. A terminal is often idle
# — an operator watching glances types nothing for minutes — and an intermediary that drops a silent
# connection would look like the terminal dying on its own. 0 disables the server-side timeout; the
# client's own reconnect and the session's linger window are what handle a connection that is really
# gone.
quarkus.websockets-next.server.auto-ping-interval=30S

# --- the packaged artifact ----------------------------------------------------------------------
# Name the build output `qits-platform-system` rather than
# qits-platform-system-service-<version>-runner, so `-Dnative` produces
# target/qits-platform-system and the process is identifiable in `ps` / `docker top` — which matters
# here, because this service's own work is spawning `docker` children and somebody will read that
# process tree. The failsafe plugin's native.image.path in service/pom.xml spells the same name; the
# two are the same string in two files and move together.
quarkus.package.output-name=qits-platform-system
quarkus.package.jar.add-runner-suffix=false

# ForeignPty must be initialised at RUN time, and this line is the difference between a native build
# and no native build at all.
#
# Quarkus initialises application classes at BUILD time by default. For ForeignPty that means its
# `static final` downcall MethodHandles are constructed by the image builder and land in the image
# heap — and a MethodHandle bound to a native entry point cannot be analysed there. The build dies
# in the pointsto analysis with `unexpected input could not be handled: linkToNative`, pointing at
# ForeignPty.open. It is exactly backwards from what one expects: making the handles build-time
# constants is what breaks it, and the same class initialised at run time builds and runs.
#
# The descriptors themselves are declared in the domain jar's
# META-INF/native-image/eu.wohlben.qits/qits-platform-system-domain/reachability-metadata.json. Both
# are required and neither substitutes for the other: without the metadata GraalVM registers zero
# downcall stubs, without this flag it never gets far enough to use them.
quarkus.native.additional-build-args=--initialize-at-run-time=eu.wohlben.qits.system.terminal.ForeignPty

# The same flag is NOT settable here for the JVM path, and that asymmetry is worth a note: a runner
# jar cannot add its own JVM flags, so no property fixes it. Pass it on the command line:
#
#     java --enable-native-access=ALL-UNNAMED -jar target/quarkus-app/quarkus-run.jar
#
# Both modules' surefire blocks set it for the suites, which are the other place a JVM opens a PTY.
