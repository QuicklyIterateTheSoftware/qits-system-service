# Defaults for the qits-platform-system DOMAIN.
#
# A library jar's META-INF/microprofile-config.properties is read at ordinal 100 — below the
# deployable's own application.properties (250) and far below environment variables (300). So every
# key here is a DEFAULT the deployment may override with QITS_SYSTEM_* and nothing here is a
# decision a deployment cannot revisit.
#
# They live in this module rather than in service/application.properties because the code that
# reads them is here: the docker runner, the read beans and the terminal registry. A key and the
# class that injects it in one place is what keeps them from drifting.

# --- the docker CLI -------------------------------------------------------------------------------
# The binary, on PATH. It is a config key rather than a constant for one reason that is not
# hypothetical: the test suite points it at a fake `docker` shell script, which is how every REST
# and WebSocket test runs with no daemon anywhere near it.
qits.system.docker.binary=docker

# THE DEADLINE ON EVERY READ. A docker call with no deadline is a request worker held forever by a
# daemon that stopped answering — and this service holds a socket to a daemon that is also building
# images and running the platform, so "slow" is a state it will meet. 20 seconds is far past a
# healthy `docker ps` (milliseconds) and short enough that a hung daemon shows up as a 503 rather
# than as a page that never loads.
#
# It does NOT bound a terminal: a PTY session has no deadline but the operator's attention.
qits.system.docker.call-timeout=PT20S

# THE OUTPUT BOUND, in characters, on every captured read. A capture with no bound is a heap whose
# size somebody else's output chose. Two megabytes is generous for a `docker ps` on a busy host
# (this machine's 26 containers with full labels come to ~40 KB) and small enough that a runaway
# answer costs one request rather than the process.
qits.system.docker.max-output-chars=2000000

# WHERE THIS SERVICE WRITES ITS OWN DOCKER config.json (qits-879). At boot, when qits-deployments has
# injected this application's own idp client (QITS_RESOURCE_IDP_CLIENT_ID/_SECRET, from the
# `idp:client` resource), the service writes one Basic `auths` entry per pull host here — dir 0700,
# file 0600. Every docker child is pointed at this directory with DOCKER_CONFIG, but ONLY when the
# file exists: otherwise the inherited DOCKER_CONFIG (an older spec's mounted /work/config) stands.
# /tmp because the file is rebuilt on every start and must never outlive the container. A key rather
# than a constant so the suite can redirect it.
qits.system.docker.config-dir=/tmp/qits-docker

# --- container logs -------------------------------------------------------------------------------
# The largest tail a caller may ask for, and how much of what comes back is kept. A log panel is a
# glance at the last few hundred lines, not a log store: the platform has qits-observability for
# that, and a request for 100000 lines here would be a heap request wearing a query parameter.
# The KEPT end is the tail, because a single line can be a megabyte.
qits.system.logs.max-tail=5000
qits.system.logs.max-chars=262144

# --- glances --------------------------------------------------------------------------------------
# The host monitor runs as a CONTAINER, not as something baked into this image: it is a full curses
# application with its own python runtime, and vendoring it would make every release of this service
# a release of it too.
#
# A REPO AND A VERSION, spelled apart, the qits-workspaces shape. A deployment moves the version
# without restating the repository, and a mirror change moves the repository without restating the
# version.
#
# `mirror.dev.localhost:8080/hub/…` is qits-platform-mirror's pull-through of docker.io — the same
# `hub` prefix images/qits-oci-postgresql uses. NEVER `latest`: a monitor that silently became a
# different major version on a restart is a debugging session nobody planned. The `-full` variant is
# required rather than preferred — it is the one that carries the docker plugin, which is what makes
# glances list the host's containers over the read-only socket it is given.
#
# THE PULL NEEDS A CREDENTIAL. The edge grants no anonymous reads since 2026-08-14, so the CLI needs
# a config.json naming both the registry and the mirror vhost. This service writes its own from its
# own idp client (see qits.system.docker.config-dir), and the HOST of this repo is where the mirror
# entry's name comes from — the registry entry is its `registry.` sibling. An older spec mounts a
# bootstrap-written one instead and points DOCKER_CONFIG at it. Without either, the first glances
# session shows docker's own 401 on the terminal — which is at least the truth, legibly.
qits.system.glances.image-repo=mirror.dev.localhost:8080/hub/nicolargo/glances
qits.system.glances.image-version=4.5.6-full

# Extra flags for glances itself, appended after the image name. Empty by default: the image's own
# entrypoint already starts the terminal UI, and every flag here is one this service would have to
# reason about. A comma-separated list when a deployment does want one (e.g. `--disable-plugin,cloud`).
qits.system.glances.args=

# Fetch the image at boot so the first Overview does not sit through a pull. BOUNDED, LOGGED AND
# NEVER FATAL: a boot must not depend on a registry being up, and a failed pull only means the first
# terminal shows docker's own pull output while it waits.
qits.system.glances.pull-at-startup=true

# --- terminals --------------------------------------------------------------------------------------
# How long a session with no attached client stays alive. The window is armed AT CREATION as well as
# on the last detach, so a POST whose browser never connected does not leave a container running.
# A minute covers a reload, a dropped wifi and a tab restored from the back button; much longer and
# an abandoned glances holds the host's pid namespace for no reason.
qits.system.terminals.linger=PT60S

# THE SAME WINDOW FOR GLANCES, after its LAST viewer detached. Seconds, not a minute, because the
# host monitor must stop when the operator leaves the Overview — nothing in it is worth coming back
# to, and a container holding the host's pid namespace with nobody watching is pure cost.
#
# NOT ZERO. A reload closes the socket and opens it again within a second or two, and the page is
# shared: a grace this size carries the session across that gap instead of tearing the container
# down and paying for a fresh start. Three seconds after the last viewer leaves is "automatically"
# to a person, and the creation window above stays the long one — a POST whose browser never
# connected has no reload to wait for.
qits.system.terminals.glances-linger=PT3S

# How many terminals may be open at once, across every operator. It is a bound on real resources —
# each one is a pseudo-terminal, a docker CLI child and (for glances) a container — not a licence
# check. Eight is more than any real session needs and small enough that a stuck client loop cannot
# fill the process table.
qits.system.terminals.max-sessions=8

# How much recent output is kept per session for replay on re-attach. A full-screen program redraws
# constantly, so this is a few seconds of glances or a decent shell history: enough that a
# reconnecting browser sees a complete frame rather than half of one.
qits.system.terminals.scrollback-bytes=262144

# How long a write to one browser may block before that browser is dropped and closed with 1011.
# The reader thread fans one PTY out to every attached sink, so a client that stopped reading would
# otherwise stall the session for everybody watching it. A non-1000 close is the client's signal to
# reconnect, which it does, and the replay puts it back where it was.
qits.system.terminals.write-timeout=PT5S

# THE LABEL VALUE THIS SERVICE MARKS ITS OWN CONTAINERS WITH, and the filter its boot sweep reaps
# by. It defaults to the application name rather than to a constant because two platforms can share
# one docker daemon — a dev and a prod stack on one host — and a sweep that reaped every
# `qits.system.owner` container would kill the other platform's live terminals on every restart.
#
# BECAUSE IT DEFAULTS TO THE APPLICATION NAME, RENAMING THE APPLICATION MOVES THIS TOO. Write and read
# both resolve from the one key, so a running service is never inconsistent with itself — but a container
# a PREVIOUS run left labelled with the old value is thereafter ignored rather than reaped, since the
# sweep filters on the new one. Nothing persists an owner anywhere (this service has no datasource), so
# the cost is one window and not a migration: the leftovers alive at the moment of the cutover, and
# nothing after. It happened once already, when the platform plane was deleted and the name went from
# qits-platform-system to qits-system; the service application.properties records the one-off cleanup.
qits.system.terminals.owner=${quarkus.application.name}
