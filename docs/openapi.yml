      description: Authentication
paths:
  /system/api/leases:
    get:
      summary: "Leases, oldest first; a service sees its own"
      operationId: listLeases
      parameters:
      - name: slotType
        in: query
        schema:
          type: string
      - name: state
        in: query
        schema:
          type: string
      - name: targetId
        in: query
        schema:
          type: string
      responses:
        "200":
          description: The leases the filter names
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lease"
        "400":
          description: An unknown state or slotType
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Lease Controller
      security:
      - SecurityScheme:
        - qits:system
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
        - qits:agent
    post:
      summary: Ask for a slot of the caller's type; QUEUED until granted
      operationId: createLease
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeaseRequest"
        required: true
      responses:
        "201":
          description: "The lease, QUEUED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lease"
        "400":
          description: "A malformed request, or IMAGE_NOT_ALLOWED"
        "403":
          description: "NOT_A_TENANT, or SLOT_TYPE_NOT_YOURS"
        "409":
          description: "LEASE_EXISTS: a live lease for this ownerRef"
        "401":
          description: Not Authorized
      tags:
      - Lease Controller
      security:
      - SecurityScheme:
        - qits:system
  /system/api/leases/{id}:
    get:
      summary: One lease
      operationId: getLease
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lease"
        "404":
          description: "No such lease, or not the caller's"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Lease Controller
      security:
      - SecurityScheme:
        - qits:system
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
        - qits:agent
    delete:
      summary: "End a lease: ENDING, then ENDED once the runner reports it gone. An\
        \ operator (qits:admin, qits:admin-agent, qits:desk-admin) ends any lease,\
        \ and an ENDING one at once"
      operationId: endLease
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - description: Why; an operator's lands in the lease's detail and the audit
        name: reason
        in: query
        schema:
          type: string
      responses:
        "200":
          description: "The lease, ENDING or ENDED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lease"
        "400":
