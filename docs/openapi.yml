      - Target Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
        - qits:system
        - qits:agent
  /system/api/targets/{id}/healthcheck:
    post:
      summary: Ask a connected target for a health check
      operationId: requestTargetHealthCheck
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "202":
          description: "Sent, or one is pending already; its requestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetHealthCheckRequested"
        "404":
          description: No such target
        "409":
          description: "TARGET_UNAVAILABLE: the target is not connected"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Target Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
        - qits:system
        - qits:agent
  /system/api/targets/{id}/login-check:
    post:
      summary: Ask a connected target to probe its sign-in now
      operationId: requestTargetLoginCheck
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "202":
          description: Sent
        "404":
          description: No such target
        "409":
          description: "TARGET_UNAVAILABLE: the target is not connected"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Target Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
        - qits:desk
  /system/api/targets/{id}/register:
    post:
      summary: Register a target's runner with its registration token; answers its
        client
      operationId: registerTarget
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterTargetRequest"
        required: true
      responses:
        "200":
          description: The runner's own client and where to use it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetRegistered"
        "400":
          description: Capabilities that are not a JSON object
        "403":
          description: The token is not this target's
        "404":
          description: No such target
        "409":
          description: "ALREADY_REGISTERED: registered, and its token spent; rotate\
            \ it to register again"
        "502":
          description: qits-idp refused the runner's client
        "503":
          description: "Commissioning is off, or RUNNER_PLANE_UNCONFIGURED"
        "401":
          description: Not Authorized
      tags:
      - Target Controller
      security:
      - SecurityScheme:
        - qits:target-runner-registration
  /system/api/targets/{id}/registration-token:
    post:
      summary: Replace a target's registration token; answers a new install line
      description: "Registered or not: a registered target keeps its client, and its\
        \ runner keeps working, until a runner installed with the new token registers.\
        \ The body is optional."
      operationId: rotateTargetRegistrationToken
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateTargetRegistrationTokenRequest"
        required: false
      responses:
        "200":
          description: "The target, its new registration token and the install line\
            \ carrying it"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetRegistration"
        "400":
          description: slots outside 0..1024 or below the target's reservations' sum
        "404":
          description: No such target
        "502":
          description: qits-idp refused the registration token
        "503":
          description: "Commissioning is off, or RUNNER_PLANE_UNCONFIGURED"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Target Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
        - qits:desk
        - qits:system
  /system/api/targets/{id}/sign-ins:
    post:
      summary: "Sign a connected target in to a harness: its runner runs the harness's\
        \ own login"
      description: "Poll the sign-in until it is AWAITING_CODE (claude: open its url,\
        \ then post the code the browser shows) or AWAITING_BROWSER (kimi: open its\
        \ url and approve its userCode), and then until it settles. It expires after\
        \ 10 minutes."
      operationId: startTargetSignIn
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartTargetSignInRequest"
        required: true
      responses:
        "202":
          description: "Started: the sign-in, STARTING"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetSignIn"
        "400":
          description: A harness other than claude or kimi
        "404":
          description: No such target
        "409":
          description: "TARGET_UNAVAILABLE: the target is not connected; SIGN_IN_RUNNING:\
            \ a sign-in for that harness has not settled, and the message names it"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Target Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
  /system/api/targets/{id}/sign-ins/{signInId}:
    get:
      summary: "One sign-in, while it runs and ~15 minutes after"
      operationId: getTargetSignIn
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: signInId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The sign-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetSignIn"
        "404":
          description: "No such target, or SIGN_IN_NOT_FOUND"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Target Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
    delete:
      summary: Stop a sign-in
      operationId: cancelTargetSignIn
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: signInId
        in: path
        required: true
        schema:
          type: string
      responses:
        "202":
          description: "The sign-in, CANCELLED; one that had settled, as it settled"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetSignIn"
        "404":
          description: "No such target, or SIGN_IN_NOT_FOUND"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Target Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
  /system/api/targets/{id}/sign-ins/{signInId}/code:
    post:
      summary: Hand an AWAITING_CODE sign-in the code the browser showed
      operationId: submitTargetSignInCode
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: signInId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetSignInCodeRequest"
        required: true
      responses:
        "202":
          description: "Relayed to the runner: the sign-in, which moves once the CLI\
            \ took it"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetSignIn"
        "400":
          description: A blank code
        "404":
          description: "No such target, or SIGN_IN_NOT_FOUND"
        "409":
          description: "SIGN_IN_NOT_AWAITING_CODE: the sign-in is not AWAITING_CODE;\
            \ TARGET_UNAVAILABLE: its runner is gone"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Target Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
  /system/api/terminals:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
        "400":
          description: Bad Request
      summary: Open
      tags:
      - Terminal Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
        - qits:system
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TerminalView"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: List
      tags:
      - Terminal Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
        - qits:system
        - qits:agent
  /system/api/terminals/{id}:
    get:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalView"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Get
      tags:
      - Terminal Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
        - qits:system
        - qits:agent
    delete:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Close
      tags:
      - Terminal Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
        - qits:system
  /system/api/work-volumes/{workKey}:
    delete:
      summary: Purge the caller's work volume on its target
      operationId: purgeWorkVolume
      parameters:
      - name: workKey
        in: path
        required: true
        schema:
          type: string
      responses:
        "202":
          description: Marked; the runner removes it with the next estate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkVolume"
        "403":
          description: NOT_A_TENANT
        "404":
          description: The caller has no such work volume
        "409":
          description: "WORK_VOLUME_IN_USE: a live lease uses it"
        "401":
          description: Not Authorized
      tags:
      - Work Volume Controller
      security:
      - SecurityScheme:
        - qits:system
info:
  title: qits-platform-system API
  version: 2026.1028.191413
