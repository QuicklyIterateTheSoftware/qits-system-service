# The targets module's defaults (qits-1481), at ordinal 100 like the domain jar's: a deployment
# overrides any of them as QITS_SYSTEM_TARGETS_*. The dossier page "Targets in qits-system: data,
# doors, allocation" and qits-system-plan.md "Execution targets" are the contract for these keys.

# ---------------------------------------------------------------------------------------------------
# THE STORE. `resources: postgresql:db` in .config/qits/deployments.yml has qits-deployments
# provision this service's database and inject QITS_RESOURCE_DB_*. A named datasource and a named
# persistence unit, `system`, because the eventstream jar brings its own (`eventstream`) and two
# unnamed ones cannot coexist. The test suites hand both a zonky embedded postgres.
quarkus.datasource.system.db-kind=postgresql
quarkus.datasource.system.jdbc.url=${QITS_RESOURCE_DB_URL}
quarkus.datasource.system.username=${QITS_RESOURCE_DB_USERNAME}
quarkus.datasource.system.password=${QITS_RESOURCE_DB_PASSWORD}
quarkus.datasource.system.jdbc.driver=eu.wohlben.qits.db.PatientPgDriver
quarkus.datasource.system.jdbc.acquisition-timeout=15S
quarkus.datasource.system.jdbc.validate-on-borrow=true
quarkus.hibernate-orm.system.datasource=system
quarkus.hibernate-orm.system.packages=eu.wohlben.qits.system.targets.entity
quarkus.flyway.system.migrate-at-start=true
quarkus.flyway.system.locations=classpath:db/system/migration

# ---------------------------------------------------------------------------------------------------
# WHO MAY LEASE WHICH SLOT TYPE. The key is the caller's application: its bearer's client id
# without the `<environment>-` prefix (dev-qits-ci -> qits-ci). Any other caller is 403; a caller
# asking for another type is 403 SLOT_TYPE_NOT_YOURS.
qits.system.targets.tenants.qits-ci=CI
qits.system.targets.tenants.qits-workspaces=WORKSPACE
qits.system.targets.tenants.qits-projects=DESK
# The prefix stripped from a caller's client id. The deployer names every service client
# `<environment>-<application>`.
qits.system.targets.environment=${QITS_ENVIRONMENT:dev}

# ---------------------------------------------------------------------------------------------------
# WHAT A SLOT MAY RUN. `spec.image` must start with its type's prefix, or the lease is 400
# IMAGE_NOT_ALLOWED; the runner gets the same map in its `ack` and refuses too. The desk's is the
# repository qits-projects-service's FrontDeskSpecs composes a desk from today
# (qits.projects.agent-image-repo).
qits.system.targets.slot-images.ci=registry.qits.${QITS_DOMAIN}/qits/build-images/ci-slot
qits.system.targets.slot-images.workspace=registry.qits.${QITS_DOMAIN}/qits/workspace
qits.system.targets.slot-images.desk=registry.qits.${QITS_DOMAIN}/qits/project-agent
# The image the runner's login probe runs (and pulls when it is absent), and the login commands
# name. It is CHOSEN, not configured (runner/ProbeImages): the image of the newest WORKSPACE lease
# that has not ENDED (a QUEUED one counts: it already carries a real, pinned image), else the newest
# DESK lease's, else this key, else none (the runner then reports UNKNOWN). No default: the
# workspace image is published under versioned tags only, and this service pins none of its own.
# qits.system.targets.probe-image=

# ---------------------------------------------------------------------------------------------------
# THE RUNNER PLANE. Every address a runner is handed is a public one, composed from the platform's
# dotted public domain; a domain without a dot is no domain and every runner door answers 503
# RUNNER_PLANE_UNCONFIGURED.
qits.system.targets.domain=${QITS_DOMAIN:}
# The wss base the register door hands a runner for its socket.
qits.system.targets.public-url=wss://system.qits.${QITS_DOMAIN:localhost}
# Moved here from qits.ci.runner.registry-mirrors.*: sent to every runner in its `ack`. The
# spellings of this platform's registry and mirror a step may name (comma-separated hosts), and
# upstream registries served under the mirror as host=/path.
qits.system.targets.registry-mirrors.registry-hosts=
qits.system.targets.registry-mirrors.mirror-hosts=
qits.system.targets.registry-mirrors.upstreams=quay.io=/quay,registry.access.redhat.com=/redhat,docker.io=/hub
# The runner version every `hello` is compared with is the pinned protocol jar's; a deployment may
# override it (blank is unset).
qits.system.targets.runner-version-override=
# How long a dropped runner is still present: its leases are left alone, and a socket inside the
# grace is not a comeback.
qits.system.targets.reconnect-grace=PT2M
# How often the idp's target-runner* clients and tokens are judged against the target table.
qits.system.targets.commission-reconcile-interval=1h
# How often every connected runner is sent its whole estate again, and the allocator runs.
qits.system.targets.estate-interval=PT1M
# A quarantined target's health checks, as offsets from its quarantine; then hourly.
qits.system.targets.healthcheck.schedule=PT1M,PT15M,PT30M,PT60M,PT90M,PT120M,PT180M
qits.system.targets.healthcheck.timeout=PT5M
qits.system.targets.healthcheck.sweep-interval=1m

# ---------------------------------------------------------------------------------------------------
# COMMISSIONING. The runner credentials (kinds target-runner and target-runner-registration) are
# minted at qits-idp with this service's own idp client, HTTP Basic — the `idp:client` resource the
# deployer injects as QITS_RESOURCE_IDP_*. With no secret, nothing is commissioned and the create
# and register doors answer 503.
qits.system.targets.idp.url=${QITS_RESOURCE_IDP_URL:http://${QITS_ENVIRONMENT:dev}-qits-idp:8080/idp}
qits.system.targets.idp.client-id=${QITS_RESOURCE_IDP_CLIENT_ID:}
qits.system.targets.idp.client-secret=${QITS_RESOURCE_IDP_CLIENT_SECRET:}
qits.system.targets.idp.patience=PT30S
qits.system.targets.idp.request-timeout=PT10S
